[project]
name = "physio-assistant"
version = "0.1.0"
description = "Educational webcam movement-monitoring prototype: posture observations and exercise rep counting."
readme = "README.md"
authors = [
    { name = "Soumyadeep Ghosh", email = "67363979+soumyadepp@users.noreply.github.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "mediapipe>=0.10.14,<0.10.22",
    "numpy>=1.26.4,<2",
    "opencv-contrib-python>=4.10,<5",
]

[project.scripts]
physio-assistant = "physio_assistant.cli:main"

[project.optional-dependencies]
voice = [
    "pyttsx3>=2.99",
]

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=1.18",
    "pre-commit>=4.3",
    "pyright>=1.1.407",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
build = [
    "pyinstaller>=6.11",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/test_*.py" = ["D103"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["cv2", "cv2.*", "mediapipe", "mediapipe.*", "pyttsx3", "pyttsx3.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests", "tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
check_untyped_defs = true

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
