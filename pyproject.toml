[project]
name = "physio-assistant"
version = "0.1.0"
description = "Educational webcam movement-monitoring prototype: posture observations and exercise rep counting."
readme = "README.md"
authors = [
    { name = "Soumyadeep Ghosh", email = "67363979+soumyadepp@users.noreply.github.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "mediapipe>=0.10.14,<0.10.22",
    "numpy>=1.26.4,<2",
    "opencv-contrib-python>=4.10,<5",
]

[project.scripts]
physio-assistant = "physio_assistant.cli:main"

[project.optional-dependencies]
voice = [
    "pyttsx3>=2.99",
]

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
build = [
    "pyinstaller>=6.11",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
